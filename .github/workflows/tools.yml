name: כלי עזר (הרצה ידנית)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "שם הסקריפט בתיקיית tools"
        required: true
        default: "find_localities.py"

permissions:
  contents: write   # רק לשמירת קובצי נתוני עזר (app/localities.json)
  models: read      # בדיקת מודלים של GitHub Models (חינם, ללא מפתח)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pyproj openpyxl
      - name: הרצה
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=. python "tools/${{ inputs.script }}"
      - name: שמירת קובצי נתוני עזר שנוצרו
        run: |
          git add app/localities.json app/locality_coords.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git config user.name "tzafon-live-bot"
          git config user.email "tzafon-live-bot@users.noreply.github.com"
          git commit -m "data: רשימת היישובים הרשמית"
          git pull --rebase && git push

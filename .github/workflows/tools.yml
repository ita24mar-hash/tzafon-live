name: כלי עזר (הרצה ידנית)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "שם הסקריפט בתיקיית tools"
        required: true
        default: "find_localities.py"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pyproj openpyxl
      - name: הרצה
        run: python "tools/${{ inputs.script }}"

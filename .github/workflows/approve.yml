name: אישור הצעות מקורות

on:
  issues:
    types: [edited, closed]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: approve
  cancel-in-progress: false

jobs:
  approve:
    # רק הודעות של הסוכן, ורק פעולה של בעל המאגר
    if: startsWith(github.event.issue.title, 'הצעות מקורות מהסוכן') && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # הוספת המקור לרשימת המקורות
      issues: write            # תגובה וסגירה של ההצעה
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-collector.txt
      - name: עיבוד האישור
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m collector.approve
      - name: שמירה
        run: |
          git add collector/sources.json collector/scout_ignore.json collector/scout_proposed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "tzafon-live-bot"
          git config user.email "tzafon-live-bot@users.noreply.github.com"
          git commit -m "מקורות: אישור הצעות הסוכן (#${{ github.event.issue.number }})"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1

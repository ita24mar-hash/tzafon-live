name: איסוף הודעות ועדכון האתר

on:
  workflow_dispatch:               # הפעלה ידנית מלשונית Actions
  schedule:
    - cron: "7,22,37,52 * * * *"   # גיבוי: כל 15 דקות (GitHub מאחר לעיתים קרובות)
# העיקר הוא השרשרת: בסוף כל הרצה היא מפעילה את הבאה, כך שהאתר מתעדכן בערך כל 5 דקות.
# אם השרשרת נקטעת (כישלון, ביטול), ההרצה המתוזמנת הבאה מחדשת אותה.

# ברירת מחדל: בלי שום הרשאה. כל שלב מקבל רק את מה שהוא צריך.
permissions: {}

# מניעת התנגשויות: רק הרצה אחת בכל רגע; הרצה נוספת ממתינה בתור.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write              # רק לשמירת יומן ההודעות במאגר הזה
    outputs:
      ok: ${{ steps.collect.outputs.ok }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: התקנת ספריות
        run: pip install -r requirements-collector.txt pytest
      - name: בדיקות (כולל סריקת סודות)
        run: python -m pytest -q tests/test_collector.py
      - name: איסוף ובניית האתר
        id: collect
        env:
          MAX_REPORTS_PER_SOURCE: "2000"
        run: python -m collector.run --out _site
      - name: בדיקת 5 הודעות מול הקישור המקורי בטלגרם
        run: python -m collector.verify
      - name: שמירת ההודעות במאגר (רק אם יש שינוי)
        run: |
          git add data/raw_reports.jsonl
          if git diff --cached --quiet; then
            echo "אין מידע חדש - לא מתבצע commit."
            exit 0
          fi
          git config user.name "tzafon-live-bot"
          git config user.email "tzafon-live-bot@users.noreply.github.com"
          git commit -m "data: הודעות חדשות"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push נדחה (ניסיון $attempt) - מושך שינויים ומנסה שוב"
            git pull --rebase
          done
          echo "לא ניתן לשמור את ההודעות במאגר"; exit 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write                 # רק לפרסום האתר
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: סימון כישלון אם מקור לא נקרא
        if: needs.collect.outputs.ok != 'true'
        run: |
          echo "לפחות מקור אחד לא נקרא. הפרטים בסיכום ההרצה ובלשונית 'מקורות' באתר."
          exit 1

  next:
    # מפעיל את ההרצה הבאה. רץ גם אם מקור אחד נכשל, כדי שהשרשרת לא תיעצר.
    needs: [collect, deploy]
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write               # רק להפעלת ההרצה הבאה של אותו תהליך
    steps:
      - name: המתנה עד 5 דקות מתחילת ההרצה, והפעלת ההרצה הבאה
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED: ${{ github.run_started_at }}
        run: |
          started=$(date -d "${STARTED:-now}" +%s 2>/dev/null || date +%s)
          wait=$(( started + 300 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "ממתין $wait שניות"; sleep "$wait"; fi
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main

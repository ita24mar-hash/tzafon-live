name: סוכן מקורות (חיפוש והצעה)

on:
  schedule:
    - cron: "41 2 * * *"      # פעם ביום, 04:41/05:41 שעון ישראל
  workflow_dispatch:

permissions: {}

concurrency:
  group: scout                 # האיסוף רץ כמעט ברציפות; התנגשות ב-push נפתרת בניסיון חוזר
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # רק לשמירת ההצעות; הסוכן לא משנה את רשימת המקורות
      issues: write            # הגשת ההצעות לאישור (issue עם התראה לבעל המאגר)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-collector.txt
      - name: חיפוש ובדיקת מקורות
        run: python -m collector.scout
      - name: הגשת הצעות חדשות לאישור
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m collector.proposals
      - name: שמירת ההצעות
        run: |
          git add data/candidates.json collector/scout_proposed.json
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git config user.name "tzafon-live-bot"
          git config user.email "tzafon-live-bot@users.noreply.github.com"
          git commit -m "data: הצעות מקורות מהסוכן"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
